# docker-compose.yml - 写小说Pro 完整部署配置
version: '3.8'

services:
  # Next.js 应用
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xiexiaoshuopro-app
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/xiexiaoshuo
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - LLM_MODEL_ID=${LLM_MODEL_ID:-minimaxai/minimax-m2.5}
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL 数据库
  db:
    image: postgres:16-alpine
    container_name: xiexiaoshuopro-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=xiexiaoshuo
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: xiexiaoshuopro-redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 数据库迁移 (一次性任务)
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run db:migrate
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/xiexiaoshuo
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - migrate

  # 种子数据 (一次性任务)
  seed:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run db:seed
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/xiexiaoshuo
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - seed

volumes:
  postgres_data:
  redis_data:
