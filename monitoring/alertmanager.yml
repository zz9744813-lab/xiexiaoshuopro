global:
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alert@xiexiaoshuopro.com'
  smtp_auth_username: ''
  smtp_auth_password: ''

templates:
  - '/etc/alertmanager/templates/*.tmpl'

route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      continue: true
    - match:
        severity: warning
      receiver: 'warning'

receivers:
  - name: 'default'
    webhook_configs:
      - url: 'http://app:3000/api/alerts/webhook'
        send_resolved: true

  - name: 'critical'
    webhook_configs:
      - url: 'http://app:3000/api/alerts/webhook'
        send_resolved: true
    email_configs:
      - to: 'admin@xiexiaoshuopro.com'
        subject: '[CRITICAL] {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          {{ end }}

  - name: 'warning'
    webhook_configs:
      - url: 'http://app:3000/api/alerts/webhook'
        send_resolved: true
